<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flex Esports</title>
</head>
<body style="margin:0; background:#0B0D10; font-family: -apple-system, sans-serif;">
  <div id="root"></div>

  <script>
    window.addEventListener("error", function (e) {
      var el = document.getElementById("root");
      if (el && !el.hasChildNodes()) {
        el.innerHTML =
          '<div style="color:#E4604B;background:#1A1D22;padding:20px;margin:16px;border-radius:8px;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;">' +
          '<b>Error al cargar Flex Esports:</b>\n\n' + (e.message || e) +
          '</div>';
      }
    });
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const FONTS = `
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    `;

    const C = {
      bg: "#0B0D10", surface: "#14171C", surface2: "#1B1F26",
      line: "#262B33", lineStrong: "#363D48",
      teal: "#4FD1C5", amber: "#F2A93B",
      text: "#ECEFF3", mute: "#8B93A1", faint: "#565D68",
      danger: "#E4604B", live: "#E4604B",
    };

    const CONTENT_KEY = "flex-esports:content-v2";

    const DEFAULT_CONTENT = {
      featuredEvent: {
        name: "Flex Championship — Temporada 4", stage: "Gran Final",
        prizePool: "$52,000", map: "Erangel", dateLabel: "Sáb 12 sep · 18:00",
      },
      liveMatch: {
        map: "Miramar", round: "Ronda 4 de 6", teamsAlive: 9, zone: "Círculo 5",
        leaderTeam: "Halcón Rojo", leaderKills: 11,
      },
      upcoming: [
        { id: "u1", time: "19:30", label: "Flex Championship — Ronda 5", map: "Sanhok" },
        { id: "u2", time: "21:00", label: "Liga Flex — Semana 8", map: "Erangel" },
        { id: "u3", time: "Dom 13:00", label: "Clasificatorio Abierto", map: "Miramar" },
      ],
      standings: [
        { id: "s1", team: "Halcón Rojo", pts: 187 },
        { id: "s2", team: "Ceniza Nocturna", pts: 172 },
        { id: "s3", team: "Frente Austral", pts: 165 },
        { id: "s4", team: "Vórtice Andino", pts: 151 },
        { id: "s5", team: "Legión Obsidiana", pts: 140 },
      ],
      teams: [
        { id: "t1", name: "Halcón Rojo", tag: "HLC", region: "Región Andina", photo: "" },
        { id: "t2", name: "Ceniza Nocturna", tag: "CEN", region: "Cono Sur", photo: "" },
        { id: "t3", name: "Frente Austral", tag: "FRA", region: "Cono Sur", photo: "" },
        { id: "t4", name: "Vórtice Andino", tag: "VOR", region: "Región Andina", photo: "" },
        { id: "t5", name: "Legión Obsidiana", tag: "LOB", region: "Región Andina", photo: "" },
      ],
      players: [
        { id: "p1", name: "Mateo \"Nortex\" Rueda", team: "HLC", role: "Fragger", kd: "4.8", photo: "" },
        { id: "p2", name: "Sofía \"Ashline\" Peralta", team: "CEN", role: "IGL", kd: "3.1", photo: "" },
        { id: "p3", name: "Diego \"Wraith7\" Salas", team: "FRA", role: "Scout", kd: "4.2", photo: "" },
        { id: "p4", name: "Valentina \"Ruinas\" Ibarra", team: "VOR", role: "Support", kd: "2.6", photo: "" },
      ],
      news: [
        { id: "n1", tag: "Traspaso", title: "Nortex firma con Halcón Rojo para la Temporada 4", time: "3 h" },
        { id: "n2", tag: "Torneo", title: "Bolsa de premios confirmada en $52,000", time: "1 d" },
        { id: "n3", tag: "Resultado", title: "Ceniza Nocturna toma el liderato de la liga", time: "2 d" },
      ],
      stats: [
        { id: "st1", label: "Equipos activos", value: "68" },
        { id: "st2", label: "Jugadores", value: "412" },
        { id: "st3", label: "Partidas 2026", value: "1,204" },
        { id: "st4", label: "Premios 2026", value: "$210K" },
      ],
    };

    function uid() {
      return Math.random().toString(36).slice(2, 9);
    }

    function loadContent() {
      try {
        const raw = window.localStorage.getItem(CONTENT_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return DEFAULT_CONTENT;
    }

    function saveContentToDisk(next) {
      try {
        window.localStorage.setItem(CONTENT_KEY, JSON.stringify(next));
        return true;
      } catch (e) {
        return false;
      }
    }

    // Resizes/compresses an uploaded image client-side before storing it,
    // so photos don't blow past localStorage's ~5MB quota.
    function resizeImageFile(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Imagen inválida"));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function Icon({ name, size = 20, color = "currentColor" }) {
      const s = { width: size, height: size, display: "block", flexShrink: 0 };
      const st = { fill: "none", stroke: color, strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
      if (name === "home") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M3 11l9-7 9 7" /><path {...st} d="M5 10v10h14V10" /></svg>;
      if (name === "team") return <svg style={s} viewBox="0 0 24 24"><circle cx="8" cy="8" r="3" {...st} /><circle cx="16" cy="8" r="3" {...st} /><path {...st} d="M2 20c0-3 2.5-5 6-5s6 2 6 5M10 20c0-3 2.5-5 6-5s6 2 6 5" /></svg>;
      if (name === "user") return <svg style={s} viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" {...st} /><path {...st} d="M4.5 20c1.6-3.6 5-5 7.5-5s5.9 1.4 7.5 5" /></svg>;
      if (name === "edit") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M4 20l4-1 11-11-3-3L5 16l-1 4z" /></svg>;
      if (name === "search") return <svg style={s} viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" {...st} /><path {...st} d="M20 20l-4.5-4.5" /></svg>;
      if (name === "camera") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M4 8h3l1.5-2h7L17 8h3v11H4V8z" /><circle cx="12" cy="13" r="3.4" {...st} /></svg>;
      if (name === "back") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M15 5l-7 7 7 7" /></svg>;
      if (name === "trash") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13" /></svg>;
      if (name === "plus") return <svg style={s} viewBox="0 0 24 24"><path {...st} d="M12 5v14M5 12h14" /></svg>;
      return null;
    }

    const TABS = [
      { key: "inicio", label: "Inicio", icon: "home" },
      { key: "equipos", label: "Equipos", icon: "team" },
      { key: "jugadores", label: "Jugadores", icon: "user" },
      { key: "editar", label: "Editar", icon: "edit" },
    ];

    function Avatar({ photo, initial, size = 40, radius = "50%" }) {
      if (photo) {
        return <img src={photo} alt="" style={{ width: size, height: size, borderRadius: radius, objectFit: "cover", border: `1px solid ${C.line}`, flexShrink: 0 }} />;
      }
      return (
        <div style={{
          width: size, height: size, borderRadius: radius, background: C.surface2, border: `1px solid ${C.line}`,
          display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Space Grotesk, sans-serif",
          fontWeight: 700, fontSize: size * 0.38, color: C.teal, flexShrink: 0,
        }}>{initial}</div>
      );
    }

    function PhotoButton({ onPick, size = 26 }) {
      const inputRef = useRef(null);
      const [busy, setBusy] = useState(false);
      async function handleChange(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        setBusy(true);
        try {
          const dataUrl = await resizeImageFile(file, 480, 0.82);
          onPick(dataUrl);
        } catch (err) {
          alert("No se pudo procesar la imagen: " + err.message);
        }
        setBusy(false);
      }
      return (
        <>
          <button type="button" onClick={() => inputRef.current && inputRef.current.click()} style={{
            width: size, height: size, borderRadius: "50%", background: C.surface2, border: `1px solid ${C.line}`,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
          }} aria-label="Cambiar foto">
            <Icon name="camera" size={size * 0.55} color={busy ? C.faint : C.teal} />
          </button>
          <input ref={inputRef} type="file" accept="image/*" onChange={handleChange} style={{ display: "none" }} />
        </>
      );
    }

    function TabHeader({ title, right }) {
      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 9, padding: "20px 18px 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <div style={{ width: 3, height: 16, background: C.teal }} />
            <h2 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 17, fontWeight: 600, margin: 0 }}>{title}</h2>
          </div>
          {right}
        </div>
      );
    }

    function SearchBox({ value, onChange, placeholder }) {
      return (
        <div style={{ margin: "0 18px 14px", display: "flex", alignItems: "center", gap: 8, background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "9px 12px" }}>
          <Icon name="search" size={16} color={C.faint} />
          <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} style={{
            flex: 1, background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 13,
          }} />
        </div>
      );
    }

    function FlexEsportsApp() {
      const [content, setContent] = useState(DEFAULT_CONTENT);
      const [activeTab, setActiveTab] = useState("inicio");
      const [detail, setDetail] = useState(null); // { type: 'team'|'player', id }
      const [teamQuery, setTeamQuery] = useState("");
      const [playerQuery, setPlayerQuery] = useState("");

      useEffect(() => {
        const loaded = loadContent();
        setContent(loaded);
        saveContentToDisk(loaded);
      }, []);

      function persist(next) {
        setContent(next);
        saveContentToDisk(next);
      }

      function updateTeamPhoto(id, photo) {
        persist({ ...content, teams: content.teams.map((t) => (t.id === id ? { ...t, photo } : t)) });
      }
      function updatePlayerPhoto(id, photo) {
        persist({ ...content, players: content.players.map((p) => (p.id === id ? { ...p, photo } : p)) });
      }

      const filteredTeams = content.teams.filter((t) =>
        (t.name + " " + t.tag + " " + t.region).toLowerCase().includes(teamQuery.toLowerCase())
      );
      const filteredPlayers = content.players.filter((p) =>
        (p.name + " " + p.team + " " + p.role).toLowerCase().includes(playerQuery.toLowerCase())
      );

      const detailTeam = detail && detail.type === "team" ? content.teams.find((t) => t.id === detail.id) : null;
      const detailPlayer = detail && detail.type === "player" ? content.players.find((p) => p.id === detail.id) : null;

      return (
        <div style={{ background: "#000", minHeight: "100vh", width: "100%", display: "flex", justifyContent: "center", padding: "18px 0", fontFamily: "Inter, sans-serif" }}>
          <style>{FONTS}</style>

          <div style={{
            width: 390, maxWidth: "100%", background: C.bg, borderRadius: 34, border: `8px solid #1A1D22`,
            overflow: "hidden", position: "relative", boxShadow: "0 0 0 1px #000", minHeight: 780, display: "flex", flexDirection: "column",
          }}>
            <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 130, height: 22, background: "#1A1D22", borderRadius: "0 0 14px 14px", zIndex: 20 }} />

            <div style={{ padding: "34px 18px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.line}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 26, height: 26, borderRadius: 6, background: C.teal, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 14, color: "#06201D" }}>F</div>
                <span style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 16, letterSpacing: 0.2 }}>Flex Esports</span>
              </div>
              <span style={{ fontSize: 10, fontWeight: 600, color: C.amber, border: `1px solid ${C.amber}`, borderRadius: 4, padding: "2px 7px", letterSpacing: 0.6 }}>DEMO · BETA</span>
            </div>

            <div style={{ flex: 1, overflowY: "auto", color: C.text }}>
              {detailTeam ? (
                <TeamDetail team={detailTeam} players={content.players} onBack={() => setDetail(null)} onPhoto={(photo) => updateTeamPhoto(detailTeam.id, photo)} />
              ) : detailPlayer ? (
                <PlayerDetail player={detailPlayer} onBack={() => setDetail(null)} onPhoto={(photo) => updatePlayerPhoto(detailPlayer.id, photo)} />
              ) : (
                <>
                  {activeTab === "inicio" && <HomeTab content={content} onOpenTeam={(id) => setDetail({ type: "team", id })} />}
                  {activeTab === "equipos" && (
                    <EquiposTab teams={filteredTeams} query={teamQuery} setQuery={setTeamQuery}
                      onOpen={(id) => setDetail({ type: "team", id })} onPhoto={updateTeamPhoto} />
                  )}
                  {activeTab === "jugadores" && (
                    <JugadoresTab players={filteredPlayers} query={playerQuery} setQuery={setPlayerQuery}
                      onOpen={(id) => setDetail({ type: "player", id })} onPhoto={updatePlayerPhoto} />
                  )}
                  {activeTab === "editar" && <EditarTab content={content} onSave={persist} />}
                </>
              )}
            </div>

            {!detail && (
              <div style={{ display: "flex", borderTop: `1px solid ${C.line}`, background: C.surface, padding: "8px 4px 14px" }}>
                {TABS.map((t) => (
                  <button key={t.key} onClick={() => setActiveTab(t.key)} style={{
                    flex: 1, background: "transparent", border: "none", display: "flex", flexDirection: "column",
                    alignItems: "center", gap: 4, padding: "6px 0", cursor: "pointer",
                    color: activeTab === t.key ? C.teal : C.faint,
                  }}>
                    <Icon name={t.icon} size={19} color={activeTab === t.key ? C.teal : C.faint} />
                    <span style={{ fontSize: 10, fontWeight: 500 }}>{t.label}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------- Home ----------
    function HomeTab({ content, onOpenTeam }) {
      const fe = content.featuredEvent, lm = content.liveMatch;
      return (
        <div style={{ paddingBottom: 20 }}>
          <div style={{ margin: "18px 18px 0", background: `linear-gradient(150deg, ${C.surface2}, ${C.surface})`, border: `1px solid ${C.line}`, borderRadius: 14, padding: 18 }}>
            <div style={{ fontSize: 11, color: C.teal, letterSpacing: 0.5, marginBottom: 8, fontFamily: "Space Grotesk, sans-serif" }}>{fe.stage} · {fe.dateLabel}</div>
            <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 19, lineHeight: 1.2, marginBottom: 10 }}>{fe.name}</div>
            <div style={{ display: "flex", gap: 16, fontSize: 12, color: C.mute }}><span>{fe.map}</span><span>{fe.prizePool}</span></div>
          </div>

          <div style={{ margin: "14px 18px 0", background: "rgba(228,96,75,0.12)", border: `1px solid ${C.live}`, borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.live }} />
              <span style={{ fontSize: 11, fontWeight: 700, color: C.live, letterSpacing: 0.5 }}>EN VIVO</span>
            </div>
            <div style={{ fontSize: 12.5 }}>{lm.map} · {lm.zone} · {lm.teamsAlive} equipos con vida</div>
            <div style={{ fontSize: 11.5, color: C.mute, marginTop: 2 }}>Líder: {lm.leaderTeam} — {lm.leaderKills} bajas</div>
          </div>

          <TabHeader title="Próximas partidas" />
          <div style={{ padding: "0 18px" }}>
            {content.upcoming.map((m, i) => (
              <div key={m.id} style={{ display: "flex", gap: 12, padding: "10px 0", borderBottom: i < content.upcoming.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <span style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 600, color: C.teal, fontSize: 13, width: 58 }}>{m.time}</span>
                <div><div style={{ fontSize: 13 }}>{m.label}</div><div style={{ fontSize: 11, color: C.mute }}>{m.map}</div></div>
              </div>
            ))}
          </div>

          <TabHeader title="Equipos" />
          <div style={{ display: "flex", gap: 10, padding: "0 18px", overflowX: "auto" }}>
            {content.teams.map((t) => (
              <div key={t.id} onClick={() => onOpenTeam(t.id)} style={{ minWidth: 120, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14, flexShrink: 0, cursor: "pointer" }}>
                <Avatar photo={t.photo} initial={t.tag[0]} size={34} radius={8} />
                <div style={{ fontSize: 12.5, fontWeight: 500, margin: "10px 0 3px" }}>{t.name}</div>
                <div style={{ fontSize: 10.5, color: C.faint }}>{t.region}</div>
              </div>
            ))}
          </div>

          <TabHeader title="La temporada en números" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, padding: "0 18px 8px" }}>
            {content.stats.map((s) => (
              <div key={s.id} style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14 }}>
                <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 21 }}>{s.value}</div>
                <div style={{ fontSize: 11, color: C.mute, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          <TabHeader title="Noticias" />
          <div style={{ padding: "0 18px" }}>
            {content.news.map((n, i) => (
              <div key={n.id} style={{ padding: "10px 0", borderBottom: i < content.news.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                  <span style={{ fontSize: 9.5, color: C.amber, border: `1px solid ${C.amber}`, borderRadius: 4, padding: "1px 5px" }}>{n.tag.toUpperCase()}</span>
                  <span style={{ fontSize: 10.5, color: C.faint }}>{n.time}</span>
                </div>
                <div style={{ fontSize: 13 }}>{n.title}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Equipos ----------
    function EquiposTab({ teams, query, setQuery, onOpen, onPhoto }) {
      return (
        <div style={{ paddingBottom: 20 }}>
          <TabHeader title="Equipos" />
          <SearchBox value={query} onChange={setQuery} placeholder="Buscar equipo, tag o región…" />
          <div style={{ padding: "0 18px" }}>
            {teams.length === 0 && <div style={{ fontSize: 12, color: C.faint, padding: "14px 0" }}>Sin resultados.</div>}
            {teams.map((t, i) => (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: i < teams.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div onClick={() => onOpen(t.id)} style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, cursor: "pointer" }}>
                  <Avatar photo={t.photo} initial={t.tag[0]} size={40} radius={9} />
                  <div><div style={{ fontSize: 13.5, fontWeight: 500 }}>{t.name}</div><div style={{ fontSize: 11, color: C.mute }}>{t.tag} · {t.region}</div></div>
                </div>
                <PhotoButton onPick={(photo) => onPhoto(t.id, photo)} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Jugadores ----------
    function JugadoresTab({ players, query, setQuery, onOpen, onPhoto }) {
      return (
        <div style={{ paddingBottom: 20 }}>
          <TabHeader title="Jugadores" />
          <SearchBox value={query} onChange={setQuery} placeholder="Buscar jugador, equipo o rol…" />
          <div style={{ padding: "0 18px" }}>
            {players.length === 0 && <div style={{ fontSize: 12, color: C.faint, padding: "14px 0" }}>Sin resultados.</div>}
            {players.map((p, i) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: i < players.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div onClick={() => onOpen(p.id)} style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, cursor: "pointer" }}>
                  <Avatar photo={p.photo} initial={p.name.split('"')[0].trim()[0]} size={40} />
                  <div><div style={{ fontSize: 13.5 }}>{p.name}</div><div style={{ fontSize: 11, color: C.mute }}>{p.team} · {p.role} · K/D {p.kd}</div></div>
                </div>
                <PhotoButton onPick={(photo) => onPhoto(p.id, photo)} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Detail views ----------
    function DetailHeader({ title, onBack }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "18px 18px 4px" }}>
          <button onClick={onBack} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4 }} aria-label="Volver">
            <Icon name="back" size={20} color={C.text} />
          </button>
          <span style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 600, fontSize: 15 }}>{title}</span>
        </div>
      );
    }

    function TeamDetail({ team, players, onBack, onPhoto }) {
      const roster = players.filter((p) => p.team === team.tag);
      return (
        <div style={{ paddingBottom: 24 }}>
          <DetailHeader title="Equipo" onBack={onBack} />
          <div style={{ padding: "10px 18px 0", display: "flex", alignItems: "center", gap: 16 }}>
            <Avatar photo={team.photo} initial={team.tag[0]} size={64} radius={12} />
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 18 }}>{team.name}</div>
              <div style={{ fontSize: 12, color: C.mute, marginTop: 2 }}>{team.tag} · {team.region}</div>
            </div>
            <PhotoButton onPick={onPhoto} size={30} />
          </div>

          <TabHeader title={`Plantilla (${roster.length})`} />
          <div style={{ padding: "0 18px" }}>
            {roster.length === 0 && <div style={{ fontSize: 12, color: C.faint }}>Aún no hay jugadores asignados a este equipo.</div>}
            {roster.map((p, i) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: i < roster.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <Avatar photo={p.photo} initial={p.name.split('"')[0].trim()[0]} size={38} />
                <div style={{ flex: 1 }}><div style={{ fontSize: 13 }}>{p.name}</div><div style={{ fontSize: 11, color: C.mute }}>{p.role}</div></div>
                <div style={{ fontSize: 12.5, color: C.teal, fontWeight: 600 }}>{p.kd}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PlayerDetail({ player, onBack, onPhoto }) {
      return (
        <div style={{ paddingBottom: 24 }}>
          <DetailHeader title="Jugador" onBack={onBack} />
          <div style={{ padding: "10px 18px 0", display: "flex", alignItems: "center", gap: 16 }}>
            <Avatar photo={player.photo} initial={player.name.split('"')[0].trim()[0]} size={64} />
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 17, lineHeight: 1.3 }}>{player.name}</div>
              <div style={{ fontSize: 12, color: C.mute, marginTop: 2 }}>{player.team} · {player.role}</div>
            </div>
            <PhotoButton onPick={onPhoto} size={30} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, padding: "20px 18px 8px" }}>
            <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14 }}>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 21, color: C.teal }}>{player.kd}</div>
              <div style={{ fontSize: 11, color: C.mute, marginTop: 2 }}>K/D ratio</div>
            </div>
            <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14 }}>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 21 }}>{player.role}</div>
              <div style={{ fontSize: 11, color: C.mute, marginTop: 2 }}>Rol en el equipo</div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Editar (admin-style content editor, no login gate) ----------
    const ADMIN_SECTIONS = [
      { key: "evento", label: "Torneo" }, { key: "vivo", label: "En vivo" },
      { key: "equipos", label: "Equipos" }, { key: "jugadores", label: "Jugadores" },
      { key: "ranking", label: "Ranking" }, { key: "partidas", label: "Partidas" },
      { key: "noticias", label: "Noticias" }, { key: "stats", label: "Stats" },
    ];

    function fieldStyle() {
      return { width: "100%", background: C.surface2, border: `1px solid ${C.line}`, color: C.text, fontSize: 13, padding: "9px 11px", borderRadius: 7, outline: "none", boxSizing: "border-box", marginBottom: 8 };
    }

    function EditarTab({ content, onSave }) {
      const [section, setSection] = useState("evento");
      const [flash, setFlash] = useState(false);
      function save(next) { onSave(next); setFlash(true); setTimeout(() => setFlash(false), 1200); }

      return (
        <div style={{ paddingBottom: 24 }}>
          <TabHeader title="Editar contenido" />
          <div style={{ padding: "0 18px 14px", fontSize: 12, color: C.mute }}>Los cambios se guardan en este navegador y se ven al instante en toda la app.</div>

          <div style={{ display: "flex", gap: 6, padding: "0 18px 16px", overflowX: "auto" }}>
            {ADMIN_SECTIONS.map((s) => (
              <button key={s.key} onClick={() => setSection(s.key)} style={{
                flexShrink: 0, fontSize: 12, padding: "7px 12px", borderRadius: 20, cursor: "pointer",
                background: section === s.key ? C.teal : "transparent", color: section === s.key ? "#06201D" : C.mute,
                border: `1px solid ${section === s.key ? C.teal : C.line}`, fontWeight: section === s.key ? 600 : 400,
              }}>{s.label}</button>
            ))}
          </div>

          {flash && <div style={{ margin: "0 18px 14px", background: "rgba(79,209,197,0.12)", border: `1px solid ${C.teal}`, color: C.teal, fontSize: 12, padding: "8px 12px", borderRadius: 8 }}>Cambios guardados.</div>}

          <div style={{ padding: "0 18px" }}>
            {section === "evento" && <EventoEditor content={content} save={save} />}
            {section === "vivo" && <VivoEditor content={content} save={save} />}
            {section === "equipos" && <ListEditor items={content.teams} save={(items) => save({ ...content, teams: items })}
              title="Nuevo equipo" withPhoto
              fields={[{ key: "name", ph: "Nombre del equipo" }, { key: "tag", ph: "Tag (ej. HLC)" }, { key: "region", ph: "Región" }]}
              render={(it) => `${it.name} (${it.tag}) · ${it.region}`} />}
            {section === "jugadores" && <ListEditor items={content.players} save={(items) => save({ ...content, players: items })}
              title="Nuevo jugador" withPhoto
              fields={[{ key: "name", ph: "Nombre" }, { key: "team", ph: "Tag de equipo" }, { key: "role", ph: "Rol" }, { key: "kd", ph: "K/D" }]}
              render={(it) => `${it.name} · ${it.team} · ${it.role} · ${it.kd}`} />}
            {section === "ranking" && <ListEditor items={content.standings} save={(items) => save({ ...content, standings: items })}
              title="Nueva fila de clasificación"
              fields={[{ key: "team", ph: "Equipo" }, { key: "pts", ph: "Puntos", numeric: true }]}
              render={(it) => `${it.team} — ${it.pts} pts`} />}
            {section === "partidas" && <ListEditor items={content.upcoming} save={(items) => save({ ...content, upcoming: items })}
              title="Nueva partida próxima"
              fields={[{ key: "time", ph: "Hora" }, { key: "label", ph: "Nombre de la partida" }, { key: "map", ph: "Mapa" }]}
              render={(it) => `${it.time} · ${it.label} · ${it.map}`} />}
            {section === "noticias" && <ListEditor items={content.news} save={(items) => save({ ...content, news: items })}
              title="Nueva noticia"
              fields={[{ key: "tag", ph: "Categoría" }, { key: "title", ph: "Titular" }, { key: "time", ph: "Hace... (ej. 2 h)" }]}
              render={(it) => `[${it.tag}] ${it.title}`} />}
            {section === "stats" && <ListEditor items={content.stats} save={(items) => save({ ...content, stats: items })}
              title="Nueva estadística"
              fields={[{ key: "label", ph: "Etiqueta" }, { key: "value", ph: "Valor" }]}
              render={(it) => `${it.label}: ${it.value}`} />}
          </div>
        </div>
      );
    }

    function EventoEditor({ content, save }) {
      const [f, setF] = useState(content.featuredEvent);
      const [err, setErr] = useState("");
      function submit(e) {
        e.preventDefault();
        if (!f.name.trim() || !f.stage.trim()) { setErr("Nombre y etapa son obligatorios."); return; }
        setErr(""); save({ ...content, featuredEvent: f });
      }
      return (
        <form onSubmit={submit}>
          <input style={fieldStyle()} value={f.name} placeholder="Nombre del torneo" onChange={(e) => setF({ ...f, name: e.target.value })} />
          <input style={fieldStyle()} value={f.stage} placeholder="Etapa" onChange={(e) => setF({ ...f, stage: e.target.value })} />
          <input style={fieldStyle()} value={f.prizePool} placeholder="Bolsa de premios" onChange={(e) => setF({ ...f, prizePool: e.target.value })} />
          <input style={fieldStyle()} value={f.map} placeholder="Mapa" onChange={(e) => setF({ ...f, map: e.target.value })} />
          <input style={fieldStyle()} value={f.dateLabel} placeholder="Fecha" onChange={(e) => setF({ ...f, dateLabel: e.target.value })} />
          {err && <div style={{ fontSize: 12, color: C.danger, marginBottom: 8 }}>{err}</div>}
          <SaveBtn />
        </form>
      );
    }

    function VivoEditor({ content, save }) {
      const [f, setF] = useState(content.liveMatch);
      function submit(e) {
        e.preventDefault();
        save({ ...content, liveMatch: { ...f, teamsAlive: Number(f.teamsAlive) || 0, leaderKills: Number(f.leaderKills) || 0 } });
      }
      return (
        <form onSubmit={submit}>
          <input style={fieldStyle()} value={f.map} placeholder="Mapa" onChange={(e) => setF({ ...f, map: e.target.value })} />
          <input style={fieldStyle()} value={f.round} placeholder="Ronda" onChange={(e) => setF({ ...f, round: e.target.value })} />
          <input style={fieldStyle()} value={f.zone} placeholder="Círculo actual" onChange={(e) => setF({ ...f, zone: e.target.value })} />
          <input style={fieldStyle()} type="number" value={f.teamsAlive} placeholder="Equipos con vida" onChange={(e) => setF({ ...f, teamsAlive: e.target.value })} />
          <input style={fieldStyle()} value={f.leaderTeam} placeholder="Equipo líder" onChange={(e) => setF({ ...f, leaderTeam: e.target.value })} />
          <input style={fieldStyle()} type="number" value={f.leaderKills} placeholder="Bajas del líder" onChange={(e) => setF({ ...f, leaderKills: e.target.value })} />
          <SaveBtn />
        </form>
      );
    }

    function SaveBtn() {
      return <button type="submit" style={{ width: "100%", background: C.teal, border: "none", color: "#06201D", fontWeight: 700, fontSize: 13, padding: "11px 0", borderRadius: 8, cursor: "pointer", marginTop: 4 }}>Guardar cambios</button>;
    }

    function ListEditor({ items, save, title, fields, render, withPhoto }) {
      const emptyDraft = {}; fields.forEach((f) => (emptyDraft[f.key] = ""));
      const [draft, setDraft] = useState(emptyDraft);
      const [err, setErr] = useState("");

      function add(e) {
        e.preventDefault();
        const missing = fields.some((f) => !String(draft[f.key]).trim());
        if (missing) { setErr("Completa todos los campos."); return; }
        setErr("");
        const newItem = { id: uid(), photo: "" };
        fields.forEach((f) => (newItem[f.key] = f.numeric ? Number(draft[f.key]) || 0 : draft[f.key].trim()));
        save([...items, newItem]);
        setDraft(emptyDraft);
      }
      function remove(id) { save(items.filter((it) => it.id !== id)); }
      function setPhoto(id, photo) { save(items.map((it) => (it.id === id ? { ...it, photo } : it))); }

      return (
        <div>
          <div style={{ fontSize: 12, color: C.mute, marginBottom: 8 }}>{title}</div>
          <form onSubmit={add}>
            {fields.map((f) => (
              <input key={f.key} style={fieldStyle()} type={f.numeric ? "number" : "text"} value={draft[f.key]}
                placeholder={f.ph} onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
            ))}
            {err && <div style={{ fontSize: 12, color: C.danger, marginBottom: 8 }}>{err}</div>}
            <button type="submit" style={{
              width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              background: "transparent", border: `1px solid ${C.teal}`, color: C.teal, fontWeight: 600, fontSize: 13,
              padding: "10px 0", borderRadius: 8, cursor: "pointer", marginBottom: 18,
            }}><Icon name="plus" size={15} color={C.teal} /> Publicar</button>
          </form>

          <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
            {items.length === 0 && <div style={{ padding: 14, fontSize: 12, color: C.faint, background: C.surface }}>Aún no hay elementos.</div>}
            {items.map((it, i) => (
              <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "11px 12px", background: C.surface, borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
                {withPhoto && <Avatar photo={it.photo} initial={(it.name || it.team || "?")[0]} size={30} radius={7} />}
                <span style={{ fontSize: 12.5, flex: 1 }}>{render(it)}</span>
                {withPhoto && <PhotoButton onPick={(photo) => setPhoto(it.id, photo)} size={26} />}
                <button onClick={() => remove(it.id)} aria-label="Eliminar" style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4 }}>
                  <Icon name="trash" size={16} color={C.danger} />
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById("root")).render(<FlexEsportsApp />);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="color:#E4604B;background:#1A1D22;padding:20px;margin:16px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;">Error al iniciar la app:\n\n' + e.message + '</div>';
    }
  </script>
</body>
</html>
